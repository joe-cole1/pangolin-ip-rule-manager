name: Pangolin compatibility

on:
  workflow_dispatch:
  # Owner-applied label: pre-merge validation without automatic runs on PR changes.
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  compatibility:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'pangolin-compatibility' &&
       github.actor == github.repository_owner &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      COMPAT_PROJECT: pangolin-compat-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Bootstrap disposable Pangolin baseline
        run: python3 scripts/pangolin_compatibility.py --version 1.24.0 --project "$COMPAT_PROJECT"
      - name: Fallback teardown (including cancelled or failed tests)
        if: always()
        run: python3 scripts/pangolin_compatibility.py --cleanup --project "$COMPAT_PROJECT"
