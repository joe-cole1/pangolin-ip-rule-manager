name: Python package
permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Read Python version from Dockerfile
      id: python
      run: |
        version=$(python3 scripts/python_version.py)
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Set up Python ${{ steps.python.outputs.version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ steps.python.outputs.version }}
        cache: 'pip' # Speeds up subsequent runs by caching dependencies

    - name: Verify selected Python runtime
      run: python scripts/python_version.py --check

    - name: Install dependencies
      run: python -m pip install -r requirements.txt

    - name: Check submitted source with Ruff
      run: |
        python -m ruff check .
        python -m ruff format --check .

    - name: Test with pytest
      run: |
        python -m pytest

