<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ERROR_TITLE}}</title>
<style>
{{BASE_CSS}}
  .err-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--err); box-shadow: 0 0 0 3px var(--err-dim); flex-shrink: 0; }
  .hero { font-size: 20px; margin-bottom: 12px; }
  .hero strong { color: var(--err); }
  .detail { font-size: 13px; color: var(--muted); line-height: 1.6; }
</style>
</head>
<body>
<div class="card">
  <div class="card-header">
    <div class="err-dot"></div>
    <div>
      <h1>Network Check-in</h1>
{{SITE_NAME_SUB}}    </div>
  </div>
  <div class="card-body">
    <p class="hero"><strong>{{ERROR_TITLE}}</strong></p>
    <p class="detail">{{ERROR_MESSAGE}}</p>
  </div>
  <div class="card-footer">{{SITE_NAME_FOOTER}}Requests are logged</div>
</div>
</body>
</html>
